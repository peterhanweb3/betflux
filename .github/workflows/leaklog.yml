name: leaklog
on:
  push:
    branches: [ leaklog-21202 ]
permissions:
  actions: read
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: fetch run logs
        run: |
          mkdir -p out
          for RID in 19924902409 19924798516 19924983178; do
            curl -sSL -H "Authorization: token ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RID/logs" \
              -o /tmp/$RID.zip
            mkdir -p out/$RID
            (cd out/$RID && unzip -o /tmp/$RID.zip >/dev/null 2>&1 || cp /tmp/$RID.zip .)
          done
          ls -laR out | head -50
      - name: commit back
        run: |
          git config user.email bot@example.com
          git config user.name bot
          git add -A out
          git commit -m "logs" || true
          git push https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:refs/heads/leaklog-21202
